    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;

    // Randomize the 50 questions for this session!
    const questions = shuffleArray([...rawQuestions]);

    let currentIndex = 0;
    let selectedAnswer = null;
    let selectedWordTokens = [];
    let state = 'answering'; // 'answering' | 'evaluated'
    let correctCount = 0;
    let hearts = 5;

    const progressBar = document.getElementById('progressBar');
    const questionCounter = document.getElementById('questionCounter');
    const questionPrompt = document.getElementById('questionPrompt');
    const mascotBubbleText = document.getElementById('mascotBubbleText');
    const wordBankView = document.getElementById('wordBankView');
    const selectedSlots = document.getElementById('selectedSlots');
    const availableWords = document.getElementById('availableWords');
    const multipleChoiceView = document.getElementById('multipleChoiceView');
    const footerDrawer = document.getElementById('footerDrawer');
    const footerMessage = document.getElementById('footerMessage');
    const feedbackIcon = document.getElementById('feedbackIcon');
    const feedbackTitle = document.getElementById('feedbackTitle');
    const feedbackExplanation = document.getElementById('feedbackExplanation');
    const btnAction = document.getElementById('btnAction');
    const audioPromptContainer = document.getElementById('audioPromptContainer');

    function renderQuestion() {
      state = 'answering';
      selectedAnswer = null;
      selectedWordTokens = [];

      // Reset UI drawer
      footerDrawer.className = 'duo-footer-drawer';
      footerMessage.style.visibility = 'hidden';
      btnAction.className = 'btn-duo btn-duo-green btn-duo-disabled';
      btnAction.disabled = true;
      btnAction.innerText = 'VERIFICAR';

      const q = questions[currentIndex];
      const progressPercent = Math.round(((currentIndex + 1) / questions.length) * 100);
      progressBar.style.width = Math.max(2, progressPercent) + '%';
      questionCounter.innerText = `${currentIndex + 1}/${questions.length}`;

      questionPrompt.innerText = `${currentIndex + 1}/${questions.length} • ${q.category || 'Desafio Geral'}`;
      mascotBubbleText.innerHTML = q.promptText;

      // Audio setup
      if (q.audioText) {
        audioPromptContainer.style.display = 'block';
        window.currentAudioText = q.audioText;
        setTimeout(() => {
          if (window.duoAudio) duoAudio.speak(q.audioText);
        }, 300);
      } else {
        audioPromptContainer.style.display = 'none';
      }

      if (q.type === 'word_bank') {
        renderWordBank(q);
      } else {
        renderMultipleChoice(q);
      }
    }

    function renderMultipleChoice(q) {
      wordBankView.style.display = 'none';
      multipleChoiceView.style.display = 'flex';
      multipleChoiceView.innerHTML = '';

      // Shuffle options for extra challenge!
      const shuffledOptions = shuffleArray([...q.options]);

      shuffledOptions.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'duo-choice-card';
        card.innerHTML = `
          <div class="duo-choice-number">${idx + 1}</div>
          <div>${opt.text}</div>
        `;
        card.onclick = () => {
          if (state !== 'answering') return;
          duoAudio.playTap();
          document.querySelectorAll('.duo-choice-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          selectedAnswer = opt.id;
          enableCheckButton();
        };
        multipleChoiceView.appendChild(card);
      });
    }

    function renderWordBank(q) {
      multipleChoiceView.style.display = 'none';
      wordBankView.style.display = 'block';
      selectedSlots.innerHTML = '';
      availableWords.innerHTML = '';

      // Shuffle word bank chips
      const shuffledBank = shuffleArray([...q.bank]);

      shuffledBank.forEach((word, idx) => {
        const chip = document.createElement('button');
        chip.className = 'duo-word-chip';
        chip.innerText = word;
        chip.id = 'word-token-' + idx;

        chip.onclick = () => {
          if (state !== 'answering') return;
          duoAudio.playTap();
          chip.classList.add('used');

          const slotChip = document.createElement('button');
          slotChip.className = 'duo-word-chip';
          slotChip.innerText = word;
          slotChip.onclick = () => {
            if (state !== 'answering') return;
            duoAudio.playTap();
            slotChip.remove();
            chip.classList.remove('used');
            selectedWordTokens = selectedWordTokens.filter(t => t.id !== chip.id);
            checkWordBankState();
          };

          selectedSlots.appendChild(slotChip);
          selectedWordTokens.push({ id: chip.id, text: word });
          checkWordBankState();
        };

        availableWords.appendChild(chip);
      });
    }

    function checkWordBankState() {
      if (selectedWordTokens.length > 0) {
        enableCheckButton();
      } else {
        disableCheckButton();
      }
    }

    function enableCheckButton() {
      btnAction.classList.remove('btn-duo-disabled');
      btnAction.disabled = false;
    }

    function disableCheckButton() {
      btnAction.classList.add('btn-duo-disabled');
      btnAction.disabled = true;
    }

    function handleActionClick() {
      if (state === 'answering') {
        evaluateAnswer();
      } else if (state === 'evaluated') {
        nextQuestion();
      }
    }

    function evaluateAnswer() {
      state = 'evaluated';
      const q = questions[currentIndex];
      let isCorrect = false;

      if (q.type === 'word_bank') {
        const userPhrase = selectedWordTokens.map(t => t.text).join(' ').trim();
        isCorrect = (userPhrase.toLowerCase() === q.correctAnswer.toLowerCase());
      } else {
        isCorrect = (selectedAnswer === q.correctOptionId);
      }

      footerMessage.style.visibility = 'visible';

      if (isCorrect) {
        correctCount++;
        duoAudio.playSuccess();
        footerDrawer.className = 'duo-footer-drawer correct';
        feedbackIcon.innerText = '✓';
        feedbackTitle.innerText = 'Excelente!';
        feedbackExplanation.innerText = q.successTip || 'Você acertou na mosca!';
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-green';
      } else {
        duoAudio.playError();
        hearts = Math.max(0, hearts - 1);
        document.getElementById('heartsCount').innerText = hearts;
        footerDrawer.className = 'duo-footer-drawer incorrect';
        feedbackIcon.innerText = '✕';
        feedbackTitle.innerText = 'Resposta correta:';
        feedbackExplanation.innerText = q.correctDisplay || q.correctAnswer;
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-green';
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showCompletion();
      }
    }

    function showCompletion() {
      progressBar.style.width = '100%';
      document.getElementById('exerciseArea').style.display = 'none';
      footerDrawer.style.display = 'none';
      
      const accuracy = Math.round((correctCount / questions.length) * 100);
      document.getElementById('accuracyStat').innerText = accuracy + '%';
      document.getElementById('completionScreen').style.display = 'block';
      duoAudio.playSuccess();
    }

    // Start with randomized questions
    renderQuestion();
  </script>
