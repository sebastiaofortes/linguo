<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Final: Simple Past (20 Questões Aleatorizadas) | Linguo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../resources/duo-theme.css">
  <script src="../../../resources/duo-sfx.js"></script>
</head>
<body>

  <!-- Top Exercise Navigation Bar -->
  <div class="duo-progress-container">
    <button class="btn-close" onclick="if(confirm('Deseja sair do Desafio Final? Seu progresso nesta sessão será perdido.')) window.location.href='../../../index.html'" title="Sair do Desafio">✕</button>
    <div class="duo-progress-track">
      <div class="duo-progress-fill" id="progressBar" style="width: 0%; background: var(--duo-yellow);"></div>
    </div>
    <div class="duo-stat-item duo-stat-heart">
      <span>❤️</span>
      <span id="heartsCount">5</span>
    </div>
  </div>

  <!-- Main Container -->
  <main class="duo-container">
    <div id="quizArea">
      <!-- Injected Dynamically by JS -->
    </div>
  </main>

  <!-- Bottom Drawer for Verification & Feedback -->
  <div class="duo-footer-drawer" id="footerDrawer">
    <div class="duo-footer-content">
      <div id="feedbackMessage" style="display: none; align-items: center; gap: 12px;">
        <div id="feedbackIcon" style="font-size: 32px;"></div>
        <div>
          <h3 id="feedbackTitle" style="font-size: 20px; font-weight: 900; margin: 0;"></h3>
          <p id="feedbackDesc" style="font-size: 14px; font-weight: 700; margin: 2px 0 0;"></p>
        </div>
      </div>
      <div id="footerPlaceholder" style="font-weight: 700; color: var(--duo-gray-400);">
        Selecione ou monte sua resposta
      </div>
      <button class="btn-duo btn-duo-green" id="btnAction" disabled onclick="handleAction()">
        VERIFICAR
      </button>
    </div>
  </div>

  <!-- Completion Celebration Screen (Hidden Initially) -->
  <div id="completionScreen" class="duo-completion-screen" style="display: none;">
    <div class="duo-completion-card">
      <div style="font-size: 64px; margin-bottom: 12px;">🏆</div>
      <h2 style="font-size: 32px; font-weight: 900; color: var(--duo-gray-900); margin-bottom: 8px;">
        Desafio Concluído!
      </h2>
      <p style="font-size: 16px; font-weight: 700; color: var(--duo-gray-400); margin-bottom: 24px;">
        Parabéns! Você dominou o Simple Past e conquistou o troféu da Unidade 3!
      </p>

      <div class="duo-completion-stats">
        <div class="duo-stat-box">
          <span style="font-size: 24px;">⚡</span>
          <span class="duo-stat-box-val">+50 XP</span>
          <span class="duo-stat-box-lbl">TOTAL GANHO</span>
        </div>
        <div class="duo-stat-box">
          <span style="font-size: 24px;">🎯</span>
          <span class="duo-stat-box-val" id="accuracyVal">100%</span>
          <span class="duo-stat-box-lbl">PRECISÃO</span>
        </div>
        <div class="duo-stat-box">
          <span style="font-size: 24px;">👑</span>
          <span class="duo-stat-box-val">UNIDADE 3</span>
          <span class="duo-stat-box-lbl">COROADA</span>
        </div>
      </div>

      <div style="margin-top: 32px;">
        <a href="../../../index.html" class="btn-duo btn-duo-yellow">CONTINUAR TRILHA ➔</a>
      </div>
    </div>
  </div>

  <script>
    // 20 Perguntas inéditas cobrindo toda a Unidade 3
    const rawQuestions = [
      {
        id: 1,
        type: "choice",
        prompt: "Ontem nós estávamos muito ocupados no escritório. Como se diz isso em inglês?",
        audioPhrase: "Yesterday we were very busy at the office.",
        options: [
          "Yesterday we were very busy at the office.",
          "Yesterday we was very busy at the office.",
          "Yesterday we did be very busy at the office."
        ],
        correctIndex: 0
      },
      {
        id: 2,
        type: "word_bank",
        prompt: "Traduza para o inglês:",
        originalPhrase: "Minha mãe fez um bolo delicioso ontem.",
        audioPhrase: "My mother made a delicious cake yesterday.",
        words: ["My", "mother", "made", "a", "delicious", "cake", "yesterday.", "maked", "did", "makes"],
        correctSentence: "My mother made a delicious cake yesterday."
      },
      {
        id: 3,
        type: "choice",
        prompt: "Qual das seguintes frases segue as regras gramaticais corretas de negação no passado?",
        audioPhrase: "I didn't understand the question.",
        options: [
          "I didn't understand the question.",
          "I didn't understood the question.",
          "I not understanded the question."
        ],
        correctIndex: 0
      },
      {
        id: 4,
        type: "word_bank",
        prompt: "Monte a frase correta em inglês:",
        originalPhrase: "Eles não viram o filme novo semana passada.",
        audioPhrase: "They didn't see the new movie last week.",
        words: ["They", "didn't", "see", "the", "new", "movie", "last", "week.", "saw", "don't", "seen"],
        correctSentence: "They didn't see the new movie last week."
      },
      {
        id: 5,
        type: "choice",
        prompt: "Como se pergunta 'A que horas você acordou hoje cedo?' no Simple Past?",
        audioPhrase: "What time did you wake up this morning?",
        options: [
          "What time did you wake up this morning?",
          "What time did you woke up this morning?",
          "What time were you wake up this morning?"
        ],
        correctIndex: 0
      },
      {
        id: 6,
        type: "word_bank",
        prompt: "Traduza esta pergunta para o inglês:",
        originalPhrase: "Você estava em casa ontem à noite?",
        audioPhrase: "Were you at home last night?",
        words: ["Were", "you", "at", "home", "last", "night?", "Was", "Did", "are"],
        correctSentence: "Were you at home last night?"
      },
      {
        id: 7,
        type: "choice",
        prompt: "Se alguém perguntar 'Was Carlos sick yesterday?', qual é a Short Answer negativa correta?",
        audioPhrase: "No, he wasn't.",
        options: [
          "No, he wasn't.",
          "No, he didn't.",
          "No, he weren't."
        ],
        correctIndex: 0
      },
      {
        id: 8,
        type: "word_bank",
        prompt: "Traduza para o inglês (atenção à duplicação CVC no passado):",
        originalPhrase: "O ônibus parou perto do parque.",
        audioPhrase: "The bus stopped near the park.",
        words: ["The", "bus", "stopped", "near", "the", "park.", "stoped", "stops", "did"],
        correctSentence: "The bus stopped near the park."
      },
      {
        id: 9,
        type: "choice",
        prompt: "Por que dizemos 'She was at school' mas dizemos 'They were at school'?",
        audioPhrase: "She was at school, but they were at school.",
        options: [
          "'Was' é a forma do passado para singulares (I, he, she, it), enquanto 'were' é para plurais (we, they) e you.",
          "'Were' só é usado quando a frase for uma negação.",
          "'Was' só pode ser usado para objetos inanimados."
        ],
        correctIndex: 0
      },
      {
        id: 10,
        type: "word_bank",
        prompt: "Monte a pergunta correta:",
        originalPhrase: "Você comprou o pão na padaria?",
        audioPhrase: "Did you buy the bread at the bakery?",
        words: ["Did", "you", "buy", "the", "bread", "at", "the", "bakery?", "bought", "do", "buys"],
        correctSentence: "Did you buy the bread at the bakery?"
      },
      {
        id: 11,
        type: "choice",
        prompt: "Complete com os verbos irregulares no passado: 'Yesterday, Lucas ___ an email and ___ a book.'",
        audioPhrase: "Yesterday, Lucas wrote an email and read a book.",
        options: [
          "wrote / read",
          "writed / readed",
          "writes / reads"
        ],
        correctIndex: 0
      },
      {
        id: 12,
        type: "word_bank",
        prompt: "Traduza para o inglês:",
        originalPhrase: "Nós não estávamos atrasados para a aula.",
        audioPhrase: "We weren't late for class.",
        words: ["We", "weren't", "late", "for", "class.", "wasn't", "didn't", "not"],
        correctSentence: "We weren't late for class."
      },
      {
        id: 13,
        type: "choice",
        prompt: "Se alguém perguntar 'Did you find your keys?', qual é a Short Answer afirmativa correta?",
        audioPhrase: "Yes, I did.",
        options: [
          "Yes, I did.",
          "Yes, I found.",
          "Yes, I was."
        ],
        correctIndex: 0
      },
      {
        id: 14,
        type: "word_bank",
        prompt: "Traduza para o inglês (verbo fly no passado):",
        originalPhrase: "Ela viajou de avião para Nova York ano passado.",
        audioPhrase: "She flew to New York last year.",
        words: ["She", "flew", "to", "New", "York", "last", "year.", "flyed", "flies", "did"],
        correctSentence: "She flew to New York last year."
      },
      {
        id: 15,
        type: "choice",
        prompt: "Por que na pergunta 'Where did you go?' usamos 'go' e não 'went'?",
        audioPhrase: "Where did you go?",
        options: [
          "Porque o auxiliar 'did' já carrega a marca do passado, logo o verbo principal fica na forma base.",
          "Porque 'go' é uma palavra imutável no inglês.",
          "Porque 'went' só pode ser usado se o sujeito for 'I'."
        ],
        correctIndex: 0
      },
      {
        id: 16,
        type: "word_bank",
        prompt: "Monte a frase negativa correta:",
        originalPhrase: "Eu não tive tempo para almoçar ontem.",
        audioPhrase: "I didn't have time for lunch yesterday.",
        words: ["I", "didn't", "have", "time", "for", "lunch", "yesterday.", "had", "don't", "has"],
        correctSentence: "I didn't have time for lunch yesterday."
      },
      {
        id: 17,
        type: "choice",
        prompt: "Como se pergunta 'Onde eles estavam domingo passado?'",
        audioPhrase: "Where were they last Sunday?",
        options: [
          "Where were they last Sunday?",
          "Where did they be last Sunday?",
          "Where was they last Sunday?"
        ],
        correctIndex: 0
      },
      {
        id: 18,
        type: "word_bank",
        prompt: "Traduza para o inglês:",
        originalPhrase: "Eu encontrei meus amigos e tirei muitas fotos.",
        audioPhrase: "I met my friends and took many photos.",
        words: ["I", "met", "my", "friends", "and", "took", "many", "photos.", "meeted", "taked", "meet"],
        correctSentence: "I met my friends and took many photos."
      },
      {
        id: 19,
        type: "choice",
        prompt: "Qual das frases está com a estrutura gramatical correta?",
        audioPhrase: "She wasn't tired, so she didn't sleep.",
        options: [
          "She wasn't tired, so she didn't sleep.",
          "She didn't was tired, so she didn't slept.",
          "She weren't tired, so she not slept."
        ],
        correctIndex: 0
      },
      {
        id: 20,
        type: "word_bank",
        prompt: "Monte a pergunta correta:",
        originalPhrase: "Eles falaram com o gerente ontem?",
        audioPhrase: "Did they speak to the manager yesterday?",
        words: ["Did", "they", "speak", "to", "the", "manager", "yesterday?", "spoke", "do", "speaks"],
        correctSentence: "Did they speak to the manager yesterday?"
      }
    ];

    // Algoritmo Fisher-Yates para embaralhamento perfeito
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Preparar questões com shuffle de lista e shuffle de alternativas
    function prepareQuestions() {
      const shuffledList = shuffleArray(rawQuestions);
      return shuffledList.map(q => {
        if (q.type === 'choice') {
          const originalCorrect = q.options[q.correctIndex];
          const shuffledOptions = shuffleArray(q.options);
          const newCorrectIndex = shuffledOptions.indexOf(originalCorrect);
          return {
            ...q,
            options: shuffledOptions,
            correctIndex: newCorrectIndex
          };
        } else if (q.type === 'word_bank') {
          return {
            ...q,
            words: shuffleArray(q.words)
          };
        }
        return q;
      });
    }

    const questions = prepareQuestions();

    let currentIdx = 0;
    let selectedOption = null;
    let selectedTokens = [];
    let isChecking = true;
    let hearts = 5;
    let errorsCount = 0;

    function renderQuestion() {
      const q = questions[currentIdx];
      const quizArea = document.getElementById('quizArea');
      selectedOption = null;
      selectedTokens = [];
      isChecking = true;

      // Update progress bar
      const pct = (currentIdx / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';

      // Reset bottom drawer
      const footerDrawer = document.getElementById('footerDrawer');
      footerDrawer.className = 'duo-footer-drawer';
      document.getElementById('feedbackMessage').style.display = 'none';
      document.getElementById('footerPlaceholder').style.display = 'block';
      const btnAction = document.getElementById('btnAction');
      btnAction.innerText = 'VERIFICAR';
      btnAction.disabled = true;
      btnAction.className = 'btn-duo btn-duo-green';

      if (q.type === 'choice') {
        quizArea.innerHTML = `
          <div style="margin-bottom: 8px; font-weight: 800; font-size: 13px; color: var(--duo-yellow-shadow); text-transform: uppercase; letter-spacing: 0.5px;">
            Questão ${currentIdx + 1} de ${questions.length} • Desafio Final
          </div>
          <h2 class="duo-question-prompt">${q.prompt}</h2>
          ${q.audioPhrase ? `
            <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
              <button class="btn-speaker" onclick="speakCurrentQuestion()">🔊</button>
              <span style="font-size: 16px; font-weight: 700; color: var(--duo-gray-700);">Ouvir frase</span>
            </div>
          ` : ''}
          <div class="duo-choices-grid">
            ${q.options.map((opt, i) => `
              <div class="duo-choice-card" onclick="selectChoice(${i})" id="choice-${i}">
                <div class="duo-choice-key">${i + 1}</div>
                <div class="duo-choice-text">${opt}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'word_bank') {
        quizArea.innerHTML = `
          <div style="margin-bottom: 8px; font-weight: 800; font-size: 13px; color: var(--duo-yellow-shadow); text-transform: uppercase; letter-spacing: 0.5px;">
            Questão ${currentIdx + 1} de ${questions.length} • Desafio Final
          </div>
          <h2 class="duo-question-prompt">${q.prompt}</h2>
          <div class="duo-bubble-phrase">
            <button class="btn-speaker" onclick="speakCurrentQuestion()">🔊</button>
            <span style="font-size: 18px; font-weight: 800;">${q.originalPhrase}</span>
          </div>

          <!-- Answer Slot Area -->
          <div class="duo-word-slots" id="slotArea">
            <span class="duo-slot-hint">Toque nas palavras para montar a frase</span>
          </div>

          <!-- Available Word Bank -->
          <div class="duo-word-bank" id="bankArea">
            ${q.words.map((w, i) => `
              <button class="duo-word-chip" id="chip-${i}" onclick="pushWord(${i})">${w}</button>
            `).join('')}
          </div>
        `;
      }
    }

    window.speakCurrentQuestion = function() {
      const q = questions[currentIdx];
      if (q && q.audioPhrase && window.duoAudio) {
        duoAudio.speak(q.audioPhrase, 'en-US');
      }
    };

    window.selectChoice = function(index) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();
      selectedOption = index;

      document.querySelectorAll('.duo-choice-card').forEach((c, idx) => {
        c.classList.toggle('selected', idx === index);
      });

      document.getElementById('btnAction').disabled = false;
      document.getElementById('footerPlaceholder').style.display = 'none';
    };

    window.pushWord = function(chipId) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();

      const chip = document.getElementById('chip-' + chipId);
      if (!chip || chip.classList.contains('used')) return;
      chip.classList.add('used');

      const q = questions[currentIdx];
      const word = q.words[chipId];
      selectedTokens.push({ word, chipId });
      renderSlots();
    };

    window.removeWord = function(index) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();

      const item = selectedTokens[index];
      const chip = document.getElementById('chip-' + item.chipId);
      if (chip) chip.classList.remove('used');

      selectedTokens.splice(index, 1);
      renderSlots();
    };

    function renderSlots() {
      const slotArea = document.getElementById('slotArea');
      if (selectedTokens.length === 0) {
        slotArea.innerHTML = '<span class="duo-slot-hint">Toque nas palavras para montar a frase</span>';
        document.getElementById('btnAction').disabled = true;
      } else {
        slotArea.innerHTML = selectedTokens.map((item, idx) => `
          <button class="duo-word-chip" onclick="removeWord(${idx})">${item.word}</button>
        `).join('');
        document.getElementById('btnAction').disabled = false;
        document.getElementById('footerPlaceholder').style.display = 'none';
      }
    }

    window.handleAction = function() {
      if (isChecking) {
        checkAnswer();
      } else {
        nextQuestion();
      }
    };

    function checkAnswer() {
      const q = questions[currentIdx];
      let isCorrect = false;

      if (q.type === 'choice') {
        isCorrect = (selectedOption === q.correctIndex);
      } else if (q.type === 'word_bank') {
        const assembled = selectedTokens.map(t => t.word).join(' ').trim();
        isCorrect = (assembled === q.correctSentence.trim());
      }

      const footerDrawer = document.getElementById('footerDrawer');
      const feedbackMsg = document.getElementById('feedbackMessage');
      const feedbackIcon = document.getElementById('feedbackIcon');
      const feedbackTitle = document.getElementById('feedbackTitle');
      const feedbackDesc = document.getElementById('feedbackDesc');
      const btnAction = document.getElementById('btnAction');

      feedbackMsg.style.display = 'flex';
      document.getElementById('footerPlaceholder').style.display = 'none';

      if (isCorrect) {
        if (window.duoAudio) duoAudio.playSuccess();
        footerDrawer.className = 'duo-footer-drawer correct';
        feedbackIcon.innerText = '✅';
        feedbackTitle.innerText = 'Sensacional!';
        feedbackTitle.style.color = 'var(--duo-green-text)';
        feedbackDesc.innerText = 'Resposta perfeita!';
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-green';
      } else {
        if (window.duoAudio) duoAudio.playError();
        errorsCount++;
        hearts = Math.max(0, hearts - 1);
        document.getElementById('heartsCount').innerText = hearts;

        footerDrawer.className = 'duo-footer-drawer incorrect';
        feedbackIcon.innerText = '❌';
        feedbackTitle.innerText = 'Resposta correta:';
        feedbackTitle.style.color = 'var(--duo-red-text)';
        const correctText = (q.type === 'choice') ? q.options[q.correctIndex] : q.correctSentence;
        feedbackDesc.innerText = correctText;
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-red';
      }

      isChecking = false;
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        renderQuestion();
      } else {
        finishLesson();
      }
    }

    function finishLesson() {
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('quizArea').style.display = 'none';
      document.getElementById('footerDrawer').style.display = 'none';
      document.getElementById('completionScreen').style.display = 'flex';

      const accuracy = Math.max(0, Math.round(((questions.length - errorsCount) / questions.length) * 100));
      document.getElementById('accuracyVal').innerText = accuracy + '%';
      if (window.duoAudio) duoAudio.playSuccess();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderQuestion();
    });
  </script>
</body>
</html>
