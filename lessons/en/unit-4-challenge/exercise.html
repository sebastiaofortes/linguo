<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio de Ouro: Tempo Futuro | Linguo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../resources/duo-theme.css">
  <script src="../../../resources/duo-sfx.js"></script>
</head>
<body>

  <!-- Top Exercise Navigation Bar -->
  <div class="duo-progress-container">
    <button class="btn-close" onclick="if(confirm('Deseja sair do Desafio de Ouro?')) window.location.href='../../../index.html'" title="Voltar para a trilha">✕</button>
    <div class="duo-progress-track">
      <div class="duo-progress-fill" id="progressBar" style="width: 0%; background: var(--duo-yellow);"></div>
    </div>
    <div class="duo-stat-item duo-stat-heart">
      <span>❤️</span>
      <span id="heartsCount">5</span>
    </div>
  </div>

  <!-- Main Container -->
  <main class="duo-container">
    <div id="quizArea">
      <!-- Injected Dynamically by JS -->
    </div>
  </main>

  <!-- Bottom Drawer for Verification & Feedback -->
  <div class="duo-footer-drawer" id="footerDrawer">
    <div class="duo-footer-content">
      <div id="feedbackMessage" style="display: none; align-items: center; gap: 12px;">
        <div id="feedbackIcon" style="font-size: 32px;"></div>
        <div>
          <h3 id="feedbackTitle" style="font-size: 20px; font-weight: 900; margin: 0;"></h3>
          <p id="feedbackDesc" style="font-size: 14px; font-weight: 700; margin: 2px 0 0;"></p>
        </div>
      </div>
      <div id="footerPlaceholder" style="font-weight: 700; color: var(--duo-gray-400);">
        Selecione ou monte sua resposta
      </div>
      <button class="btn-duo btn-duo-yellow" id="btnAction" disabled onclick="handleAction()">
        VERIFICAR
      </button>
    </div>
  </div>

  <!-- Completion Celebration Screen (Hidden Initially) -->
  <div id="completionScreen" class="duo-completion-screen" style="display: none;">
    <div class="duo-completion-card">
      <div style="font-size: 64px; margin-bottom: 12px;">🏆</div>
      <h2 style="font-size: 32px; font-weight: 900; color: var(--duo-gray-900); margin-bottom: 8px;">
        Desafio de Ouro Concluído!
      </h2>
      <p style="font-size: 16px; font-weight: 700; color: var(--duo-gray-400); margin-bottom: 24px;">
        Incrível! Você dominou todas as estruturas de Tempo Futuro no Inglês!
      </p>

      <div class="duo-completion-stats">
        <div class="duo-stat-box">
          <span style="font-size: 24px;">⚡</span>
          <span class="duo-stat-box-val">+50 XP</span>
          <span class="duo-stat-box-lbl">TOTAL GANHO</span>
        </div>
        <div class="duo-stat-box">
          <span style="font-size: 24px;">🎯</span>
          <span class="duo-stat-box-val" id="accuracyVal">100%</span>
          <span class="duo-stat-box-lbl">PRECISÃO</span>
        </div>
        <div class="duo-stat-box">
          <span style="font-size: 24px;">👑</span>
          <span class="duo-stat-box-val">UNIDADE 4</span>
          <span class="duo-stat-box-lbl">COROADA</span>
        </div>
      </div>

      <div style="margin-top: 32px;">
        <a href="../../../index.html" class="btn-duo btn-duo-yellow">CONTINUAR TRILHA ➔</a>
      </div>
    </div>
  </div>

  <script>
    const rawQuestions = [
      {
        type: "choice",
        prompt: "Alguém bate na porta. Qual é a decisão espontânea correta?",
        audioPhrase: "Someone is at the door. I will open it!",
        options: [
          "I will open it!",
          "I am going to open it 3 years ago.",
          "I open it yesterday."
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza esta frase de promessa para o inglês:",
        originalPhrase: "Eu vou te ligar amanhã. Eu prometo!",
        audioPhrase: "I will call you tomorrow. I promise!",
        words: ["I", "will", "call", "you", "tomorrow.", "I", "promise!", "am", "going"],
        correctSentence: "I will call you tomorrow. I promise!"
      },
      {
        type: "choice",
        prompt: "Qual a forma negativa de \"I will help you\"?",
        audioPhrase: "I won't help you.",
        options: [
          "I won't help you.",
          "I will don't help you.",
          "I doesn't will help you."
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase de plano futuro estruturado:",
        originalPhrase: "Eu vou viajar para Nova York no próximo mês.",
        audioPhrase: "I am going to travel to New York next month.",
        words: ["I", "am", "going", "to", "travel", "to", "New", "York", "next", "month.", "will", "traveled"],
        correctSentence: "I am going to travel to New York next month."
      },
      {
        type: "choice",
        prompt: "Olhe para as nuvens escuras no céu! Como fazer a previsão por evidência?",
        audioPhrase: "Look at the clouds! It is going to rain.",
        options: [
          "It is going to rain.",
          "It will raining right now.",
          "It rained yesterday."
        ],
        correctIndex: 0
      },
      {
        type: "choice",
        prompt: "Qual é o erro gramatical em: \"She going to study English tonight\"?",
        audioPhrase: "She is going to study English tonight.",
        options: [
          "Falta o verbo To Be (is) antes de 'going to'.",
          "O verbo study deveria estar no passado.",
          "A palavra tonight só é usada no passado."
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase de compromisso agendado no calendário:",
        originalPhrase: "Ela vai encontrar o médico nesta sexta-feira.",
        audioPhrase: "She is meeting the doctor this Friday.",
        words: ["She", "is", "meeting", "the", "doctor", "this", "Friday.", "will", "met"],
        correctSentence: "She is meeting the doctor this Friday."
      },
      {
        type: "choice",
        prompt: "Você está em um restaurante e lê o cardápio. Como faz o pedido de forma espontânea?",
        audioPhrase: "I'll have a steak and water, please.",
        options: [
          "I'll have a steak and water, please.",
          "I was going to eat yesterday.",
          "I had eaten tomorrow."
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza esta oferta de ajuda para o inglês:",
        originalPhrase: "Eu vou te ajudar com essas sacolas.",
        audioPhrase: "I will help you with those bags.",
        words: ["I", "will", "help", "you", "with", "those", "bags.", "am", "going"],
        correctSentence: "I will help you with those bags."
      },
      {
        type: "choice",
        prompt: "Em qual cenário usamos o Present Continuous (-ING) para expressar tempo futuro?",
        audioPhrase: "I am flying to Paris tomorrow at 10 AM.",
        options: [
          "Em compromissos e voos com horário e agendamento previamente confirmados.",
          "Para palpites sem nenhuma garantia.",
          "Para hábitos diários do presente."
        ],
        correctIndex: 0
      },
      {
        type: "choice",
        prompt: "Complete a frase de promessa: \"I ___ tell anyone your secret.\"",
        audioPhrase: "I won't tell anyone your secret.",
        options: [
          "won't",
          "not going",
          "don't will"
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase de decisão no momento da fala:",
        originalPhrase: "Está muito quente. Eu vou abrir a janela.",
        audioPhrase: "It is very hot. I will open the window.",
        words: ["It", "is", "very", "hot.", "I", "will", "open", "the", "window.", "am", "going"],
        correctSentence: "It is very hot. I will open the window."
      },
      {
        type: "choice",
        prompt: "Qual frase representa um plano deliberado pensado ANTES do momento da conversa?",
        audioPhrase: "We are going to buy a new house this year.",
        options: [
          "We are going to buy a new house this year.",
          "We will buy a house right this second without thinking.",
          "We bought a house 10 years ago."
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza para o inglês o compromisso futuro:",
        originalPhrase: "Nós vamos ter um jantar especial amanhã.",
        audioPhrase: "We are having a special dinner tomorrow.",
        words: ["We", "are", "having", "a", "special", "dinner", "tomorrow.", "will", "had"],
        correctSentence: "We are having a special dinner tomorrow."
      },
      {
        type: "choice",
        prompt: "Qual a contração informal em inglês usada com frequência para \"will\"?",
        audioPhrase: "I'll be there for you.",
        options: [
          "'ll (ex: I'll, You'll, She'll)",
          "'d",
          "'ve"
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase de negação com 'be going to':",
        originalPhrase: "Eles não vão assistir ao filme hoje à noite.",
        audioPhrase: "They are not going to watch the movie tonight.",
        words: ["They", "are", "not", "going", "to", "watch", "the", "movie", "tonight.", "won't", "watched"],
        correctSentence: "They are not going to watch the movie tonight."
      },
      {
        type: "choice",
        prompt: "Qual expressão temporal indica que a ação com -ING é no futuro?",
        audioPhrase: "They are visiting us next weekend.",
        options: [
          "next weekend",
          "last year",
          "two days ago"
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a resposta imediata em inglês:",
        originalPhrase: "Não temos leite. Ah, eu vou comprar!",
        audioPhrase: "We don't have milk. Oh, I will buy some!",
        words: ["We", "don't", "have", "milk.", "Oh,", "I", "will", "buy", "some!", "am", "going"],
        correctSentence: "We don't have milk. Oh, I will buy some!"
      },
      {
        type: "choice",
        prompt: "Como perguntar sobre os planos de alguém no futuro usando 'be going to'?",
        audioPhrase: "What are you going to do this weekend?",
        options: [
          "What are you going to do this weekend?",
          "What did you going to do?",
          "What will you did yesterday?"
        ],
        correctIndex: 0
      },
      {
        type: "choice",
        prompt: "Complete com a melhor forma: \"I think mankind ___ land on Mars in the future.\"",
        audioPhrase: "I think mankind will land on Mars in the future.",
        options: [
          "will",
          "is going to flight yesterday",
          "doing"
        ],
        correctIndex: 0
      }
    ];

    // Fisher-Yates Shuffle Algorithm
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Shuffle options for choice questions
    const questions = shuffleArray(rawQuestions).map(q => {
      if (q.type === 'choice') {
        const originalCorrect = q.options[q.correctIndex];
        const shuffledOpts = shuffleArray(q.options);
        const newCorrectIdx = shuffledOpts.indexOf(originalCorrect);
        return {
          ...q,
          options: shuffledOpts,
          correctIndex: newCorrectIdx
        };
      }
      return q;
    });

    let currentIdx = 0;
    let selectedOption = null;
    let selectedTokens = [];
    let isChecking = true;
    let hearts = 5;
    let errorsCount = 0;

    function renderQuestion() {
      const q = questions[currentIdx];
      const quizArea = document.getElementById('quizArea');
      selectedOption = null;
      selectedTokens = [];
      isChecking = true;

      const pct = (currentIdx / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';

      const footerDrawer = document.getElementById('footerDrawer');
      footerDrawer.className = 'duo-footer-drawer';
      document.getElementById('feedbackMessage').style.display = 'none';
      document.getElementById('footerPlaceholder').style.display = 'block';
      const btnAction = document.getElementById('btnAction');
      btnAction.innerText = 'VERIFICAR';
      btnAction.disabled = true;
      btnAction.className = 'btn-duo btn-duo-yellow';

      if (q.type === 'choice') {
        quizArea.innerHTML = `
          <div style="font-size: 14px; font-weight: 800; color: var(--duo-yellow-shadow); margin-bottom: 6px;">QUESTÃO ${currentIdx + 1} DE ${questions.length}</div>
          <h2 class="duo-question-prompt">${q.prompt}</h2>
          ${q.audioPhrase ? `
            <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
              <button class="btn-speaker" onclick="speakCurrentQuestion()">🔊</button>
              <span style="font-size: 16px; font-weight: 700; color: var(--duo-gray-700);">Ouvir frase</span>
            </div>
          ` : ''}
          <div class="duo-choices-grid">
            ${q.options.map((opt, i) => `
              <div class="duo-choice-card" onclick="selectChoice(${i})" id="choice-${i}">
                <div class="duo-choice-key">${i + 1}</div>
                <div class="duo-choice-text">${opt}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'word_bank') {
        quizArea.innerHTML = `
          <div style="font-size: 14px; font-weight: 800; color: var(--duo-yellow-shadow); margin-bottom: 6px;">QUESTÃO ${currentIdx + 1} DE ${questions.length}</div>
          <h2 class="duo-question-prompt">${q.prompt}</h2>
          <div class="duo-bubble-phrase">
            <button class="btn-speaker" onclick="speakCurrentQuestion()">🔊</button>
            <span style="font-size: 18px; font-weight: 800;">${q.originalPhrase}</span>
          </div>

          <div class="duo-word-slots" id="slotArea">
            <span class="duo-slot-hint">Toque nas palavras para montar a frase</span>
          </div>

          <div class="duo-word-bank" id="bankArea">
            ${q.words.map((w, i) => `
              <button class="duo-word-chip" id="chip-${i}" onclick="pushWord(${i})">${w}</button>
            `).join('')}
          </div>
        `;
      }
    }

    window.speakCurrentQuestion = function() {
      const q = questions[currentIdx];
      if (q && q.audioPhrase && window.duoAudio) {
        duoAudio.speak(q.audioPhrase, 'en-US');
      }
    };

    window.selectChoice = function(index) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();
      selectedOption = index;

      document.querySelectorAll('.duo-choice-card').forEach((c, idx) => {
        c.classList.toggle('selected', idx === index);
      });

      document.getElementById('btnAction').disabled = false;
      document.getElementById('footerPlaceholder').style.display = 'none';
    };

    window.pushWord = function(chipId) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();

      const chip = document.getElementById('chip-' + chipId);
      if (!chip || chip.classList.contains('used')) return;
      chip.classList.add('used');

      const q = questions[currentIdx];
      const word = q.words[chipId];
      selectedTokens.push({ word, chipId });
      renderSlots();
    };

    window.removeWord = function(index) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();

      const item = selectedTokens[index];
      const chip = document.getElementById('chip-' + item.chipId);
      if (chip) chip.classList.remove('used');

      selectedTokens.splice(index, 1);
      renderSlots();
    };

    function renderSlots() {
      const slotArea = document.getElementById('slotArea');
      if (selectedTokens.length === 0) {
        slotArea.innerHTML = '<span class="duo-slot-hint">Toque nas palavras para montar a frase</span>';
        document.getElementById('btnAction').disabled = true;
      } else {
        slotArea.innerHTML = selectedTokens.map((item, idx) => `
          <button class="duo-word-chip" onclick="removeWord(${idx})">${item.word}</button>
        `).join('');
        document.getElementById('btnAction').disabled = false;
        document.getElementById('footerPlaceholder').style.display = 'none';
      }
    }

    window.handleAction = function() {
      if (isChecking) {
        checkAnswer();
      } else {
        nextQuestion();
      }
    };

    function checkAnswer() {
      const q = questions[currentIdx];
      let isCorrect = false;

      if (q.type === 'choice') {
        isCorrect = (selectedOption === q.correctIndex);
      } else if (q.type === 'word_bank') {
        const assembled = selectedTokens.map(t => t.word).join(' ').trim();
        isCorrect = (assembled === q.correctSentence.trim());
      }

      const footerDrawer = document.getElementById('footerDrawer');
      const feedbackMsg = document.getElementById('feedbackMessage');
      const feedbackIcon = document.getElementById('feedbackIcon');
      const feedbackTitle = document.getElementById('feedbackTitle');
      const feedbackDesc = document.getElementById('feedbackDesc');
      const btnAction = document.getElementById('btnAction');

      feedbackMsg.style.display = 'flex';
      document.getElementById('footerPlaceholder').style.display = 'none';

      if (isCorrect) {
        if (window.duoAudio) duoAudio.playSuccess();
        footerDrawer.className = 'duo-footer-drawer correct';
        feedbackIcon.innerText = '✅';
        feedbackTitle.innerText = 'Incrível!';
        feedbackTitle.style.color = 'var(--duo-green-text)';
        feedbackDesc.innerText = 'Resposta perfeita!';
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-green';
      } else {
        if (window.duoAudio) duoAudio.playError();
        errorsCount++;
        hearts = Math.max(0, hearts - 1);
        document.getElementById('heartsCount').innerText = hearts;

        footerDrawer.className = 'duo-footer-drawer incorrect';
        feedbackIcon.innerText = '❌';
        feedbackTitle.innerText = 'Resposta correta:';
        feedbackTitle.style.color = 'var(--duo-red-text)';
        const correctText = (q.type === 'choice') ? q.options[q.correctIndex] : q.correctSentence;
        feedbackDesc.innerText = correctText;
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-red';
      }

      isChecking = false;
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        renderQuestion();
      } else {
        finishLesson();
      }
    }

    function finishLesson() {
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('quizArea').style.display = 'none';
      document.getElementById('footerDrawer').style.display = 'none';
      document.getElementById('completionScreen').style.display = 'flex';

      const accuracy = Math.max(0, Math.round(((questions.length - errorsCount) / questions.length) * 100));
      document.getElementById('accuracyVal').innerText = accuracy + '%';
      if (window.duoAudio) duoAudio.playSuccess();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderQuestion();
    });
  </script>
</body>
</html>
