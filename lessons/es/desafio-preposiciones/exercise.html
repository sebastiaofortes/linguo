<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Final: Preposiciones en Español | Linguo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../resources/duo-theme.css">
  <script src="../../../resources/duo-sfx.js"></script>
</head>
<body>

  <!-- Top Exercise Navigation Bar -->
  <div class="duo-progress-container">
    <button class="btn-close" onclick="if(confirm('Deseja sair do desafio?')) window.location.href='../../../index.html'" title="Voltar para a trilha">✕</button>
    <div class="duo-progress-track">
      <div class="duo-progress-fill" id="progressBar" style="width: 0%;"></div>
    </div>
    <div class="duo-stat-item duo-stat-heart">
      <span>❤️</span>
      <span id="heartsCount">5</span>
    </div>
  </div>

  <!-- Main Container -->
  <main class="duo-container">
    <div id="quizArea">
      <!-- Injected Dynamically by JS -->
    </div>
  </main>

  <!-- Bottom Drawer for Verification & Feedback -->
  <div class="duo-footer-drawer" id="footerDrawer">
    <div class="duo-footer-content">
      <div id="feedbackMessage" style="display: none; align-items: center; gap: 12px;">
        <div id="feedbackIcon" style="font-size: 32px;"></div>
        <div>
          <h3 id="feedbackTitle" style="font-size: 20px; font-weight: 900; margin: 0;"></h3>
          <p id="feedbackDesc" style="font-size: 14px; font-weight: 700; margin: 2px 0 0;"></p>
        </div>
      </div>
      <div id="footerPlaceholder" style="font-weight: 700; color: var(--duo-gray-400);">
        Selecione ou monte sua resposta
      </div>
      <button class="btn-duo btn-duo-green" id="btnAction" disabled onclick="handleAction()">
        VERIFICAR
      </button>
    </div>
  </div>

  <!-- Completion Celebration Screen -->
  <div id="completionScreen" class="duo-completion-screen" style="display: none;">
    <div class="duo-completion-card">
      <div style="font-size: 64px; margin-bottom: 12px;">🏆</div>
      <h2 style="font-size: 32px; font-weight: 900; color: var(--duo-gray-900); margin-bottom: 8px;">
        Unidade 2 Concluída!
      </h2>
      <p style="font-size: 16px; font-weight: 700; color: var(--duo-gray-400); margin-bottom: 24px;">
        Você venceu o Desafio Final de Preposições com maestria absoluta!
      </p>

      <div class="duo-completion-stats">
        <div class="duo-stat-box">
          <span style="font-size: 24px;">⚡</span>
          <span class="duo-stat-box-val">+50 XP</span>
          <span class="duo-stat-box-lbl">TOTAL GANHO</span>
        </div>
        <div class="duo-stat-box">
          <span style="font-size: 24px;">🎯</span>
          <span class="duo-stat-box-val" id="accuracyVal">100%</span>
          <span class="duo-stat-box-lbl">PRECISÃO</span>
        </div>
        <div class="duo-stat-box">
          <span style="font-size: 24px;">🔥</span>
          <span class="duo-stat-box-val">3 DIAS</span>
          <span class="duo-stat-box-lbl">OFENSIVA</span>
        </div>
      </div>

      <div style="margin-top: 32px;">
        <a href="../../../index.html" class="btn-duo btn-duo-green">CONTINUAR TRILHA ➔</a>
      </div>
    </div>
  </div>

  <script>
    // Pool of 20 Comprehensive Preposition Questions for Unit 2
    const questionPool = [
      {
        type: "choice",
        prompt: "Complete com a preposição correta de motivo/agradecimento: \"Muchas gracias ___ tu ayuda.\"",
        audioPhrase: "Muchas gracias por tu ayuda.",
        options: ["por", "para", "hacia"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza esta frase para o espanhol:",
        originalPhrase: "Este presente é para a minha mãe.",
        audioPhrase: "Este regalo es para mi madre.",
        words: ["Este", "regalo", "es", "para", "mi", "madre.", "por", "de", "con"],
        correctSentence: "Este regalo es para mi madre."
      },
      {
        type: "choice",
        prompt: "Qual preposição indica a finalidade/objetivo de um estudo? \"Estudio español ___ viajar por Sudamérica.\"",
        audioPhrase: "Estudio español para viajar por Sudamérica.",
        options: ["para", "por", "desde"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase correta em espanhol:",
        originalPhrase: "Eu ligo para você por telefone à tarde.",
        audioPhrase: "Te llamo por teléfono por la tarde.",
        words: ["Te", "llamo", "por", "teléfono", "por", "la", "tarde.", "para", "en"],
        correctSentence: "Te llamo por teléfono por la tarde."
      },
      {
        type: "choice",
        prompt: "Qual preposição expressa meio de transporte em espanhol? \"Viajo siempre ___ tren.\"",
        audioPhrase: "Viajo siempre en tren.",
        options: ["en", "de", "por"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza esta frase para o espanhol:",
        originalPhrase: "Nós vamos ao parque aos domingos.",
        audioPhrase: "Nosotros vamos al parque los domingos.",
        words: ["Nosotros", "vamos", "al", "parque", "los", "domingos.", "en", "del"],
        correctSentence: "Nosotros vamos al parque los domingos."
      },
      {
        type: "choice",
        prompt: "Qual é a contração correta de 'de' + 'el'? \"Vengo ___ supermercado.\"",
        audioPhrase: "Vengo del supermercado.",
        options: ["del", "al", "de el"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase com limite temporal em espanhol:",
        originalPhrase: "Trabalho das 9 até às 18.",
        audioPhrase: "Trabajo desde las 9 hasta las 18.",
        words: ["Trabajo", "desde", "las", "9", "hasta", "las", "18.", "por", "para"],
        correctSentence: "Trabajo desde las 9 hasta las 18."
      },
      {
        type: "choice",
        prompt: "Complete com o 'A pessoal' obrigatório: \"Visito ___ mi abuela todos los domingos.\"",
        audioPhrase: "Visito a mi abuela todos los domingos.",
        options: ["a", "en", "de"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza esta frase para o espanhol:",
        originalPhrase: "Você quer vir comigo ao cinema?",
        audioPhrase: "¿Quieres venir conmigo al cine?",
        words: ["¿Quieres", "venir", "conmigo", "al", "cine?", "con yo", "para"],
        correctSentence: "¿Quieres venir conmigo al cine?"
      },
      {
        type: "choice",
        prompt: "Por que dizemos \"Me gusta hablar contigo\" em vez de \"con tú\"?",
        audioPhrase: "Me gusta hablar contigo.",
        options: [
          "Porque a junção de 'con' + 'tú' resulta na forma especial 'contigo'",
          "Porque 'tú' não é permitido no final de frases",
          "Porque é uma exceção exclusiva do verbo gustar"
        ],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase com negação de companhia em espanhol:",
        originalPhrase: "Eu não posso viver sem você.",
        audioPhrase: "Yo no puedo vivir sin ti.",
        words: ["Yo", "no", "puedo", "vivir", "sin", "ti.", "conmigo", "por"],
        correctSentence: "Yo no puedo vivir sin ti."
      },
      {
        type: "choice",
        prompt: "Qual locução significa \"perto de\"? \"La farmacia está muy ___ mi casa.\"",
        audioPhrase: "La farmacia está muy cerca de mi casa.",
        options: ["cerca de", "lejos de", "debajo de"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza a frase de localização espacial para o espanhol:",
        originalPhrase: "O gato dorme embaixo da cama.",
        audioPhrase: "El gato duerme debajo de la cama.",
        words: ["El", "gato", "duerme", "debajo", "de", "la", "cama.", "encima"],
        correctSentence: "El gato duerme debajo de la cama."
      },
      {
        type: "choice",
        prompt: "Qual locução indica posição frontal? \"El coche está ___ la casa.\"",
        audioPhrase: "El coche está delante de la casa.",
        options: ["delante de", "detrás de", "debajo de"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Monte a frase correta em espanhol:",
        originalPhrase: "As chaves estão em cima da mesa.",
        audioPhrase: "Las llaves están encima de la mesa.",
        words: ["Las", "llaves", "están", "encima", "de", "la", "mesa.", "debajo"],
        correctSentence: "Las llaves están encima de la mesa."
      },
      {
        type: "choice",
        prompt: "Qual preposição indica prazo ou data limite? \"La entrega es ___ el viernes.\"",
        audioPhrase: "La entrega es para el viernes.",
        options: ["para", "por", "desde"],
        correctIndex: 0
      },
      {
        type: "choice",
        prompt: "Qual preposição indica a direção ou rumo sem destino final fixo? \"El avión vuela ___ el sur.\"",
        audioPhrase: "El avión vuela hacia el sur.",
        options: ["hacia", "en", "de"],
        correctIndex: 0
      },
      {
        type: "word_bank",
        prompt: "Traduza esta frase de gratidão com troca/valor para o espanhol:",
        originalPhrase: "Comprei este livro por 10 euros.",
        audioPhrase: "Compré este libro por 10 euros.",
        words: ["Compré", "este", "libro", "por", "10", "euros.", "para", "en"],
        correctSentence: "Compré este libro por 10 euros."
      },
      {
        type: "choice",
        prompt: "Por que usamos o 'A pessoal' na frase \"Conozco a Carlos\"?",
        audioPhrase: "Conozco a Carlos.",
        options: [
          "Porque Carlos é uma pessoa determinada usada como objeto da frase",
          "Porque Carlos é uma cidade na Espanha",
          "Porque o verbo conocer exige a preposição por"
        ],
        correctIndex: 0
      }
    ];

    // Fisher-Yates Shuffle Algorithm to randomize questions
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const questions = shuffleArray(questionPool);

    let currentIdx = 0;
    let selectedOption = null;
    let selectedTokens = [];
    let isChecking = true;
    let hearts = 5;
    let errorsCount = 0;

    function renderQuestion() {
      const q = questions[currentIdx];
      const quizArea = document.getElementById('quizArea');
      selectedOption = null;
      selectedTokens = [];
      isChecking = true;

      const pct = (currentIdx / questions.length) * 100;
      document.getElementById('progressBar').style.width = pct + '%';

      const footerDrawer = document.getElementById('footerDrawer');
      footerDrawer.className = 'duo-footer-drawer';
      document.getElementById('feedbackMessage').style.display = 'none';
      document.getElementById('footerPlaceholder').style.display = 'block';
      const btnAction = document.getElementById('btnAction');
      btnAction.innerText = 'VERIFICAR';
      btnAction.disabled = true;
      btnAction.className = 'btn-duo btn-duo-green';

      if (q.type === 'choice') {
        quizArea.innerHTML = `
          <div style="font-size: 13px; font-weight: 800; color: var(--duo-purple); margin-bottom: 6px; text-transform: uppercase;">
            Questão ${currentIdx + 1} de ${questions.length} • Desafio Final 🏆
          </div>
          <h2 class="duo-question-prompt">${q.prompt}</h2>
          ${q.audioPhrase ? `
            <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
              <button class="btn-speaker" onclick="speakCurrentQuestion()">🔊</button>
              <span style="font-size: 16px; font-weight: 700; color: var(--duo-gray-700);">Ouvir frase em espanhol</span>
            </div>
          ` : ''}
          <div class="duo-choices-grid">
            ${q.options.map((opt, i) => `
              <div class="duo-choice-card" onclick="selectChoice(${i})" id="choice-${i}">
                <div class="duo-choice-key">${i + 1}</div>
                <div class="duo-choice-text">${opt}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'word_bank') {
        quizArea.innerHTML = `
          <div style="font-size: 13px; font-weight: 800; color: var(--duo-purple); margin-bottom: 6px; text-transform: uppercase;">
            Questão ${currentIdx + 1} de ${questions.length} • Desafio Final 🏆
          </div>
          <h2 class="duo-question-prompt">${q.prompt}</h2>
          <div class="duo-bubble-phrase">
            <button class="btn-speaker" onclick="speakCurrentQuestion()">🔊</button>
            <span style="font-size: 18px; font-weight: 800;">${q.originalPhrase}</span>
          </div>

          <div class="duo-word-slots" id="slotArea">
            <span class="duo-slot-hint">Toque nas palavras para montar a frase</span>
          </div>

          <div class="duo-word-bank" id="bankArea">
            ${q.words.map((w, i) => `
              <button class="duo-word-chip" id="chip-${i}" onclick="pushWord(${i})">${w}</button>
            `).join('')}
          </div>
        `;
      }
    }

    window.speakCurrentQuestion = function() {
      const q = questions[currentIdx];
      if (q && q.audioPhrase && window.duoAudio) {
        duoAudio.speak(q.audioPhrase, 'es-ES');
      }
    };

    window.selectChoice = function(index) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();
      selectedOption = index;

      document.querySelectorAll('.duo-choice-card').forEach((c, idx) => {
        c.classList.toggle('selected', idx === index);
      });

      document.getElementById('btnAction').disabled = false;
      document.getElementById('footerPlaceholder').style.display = 'none';
    };

    window.pushWord = function(chipId) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();

      const chip = document.getElementById('chip-' + chipId);
      if (!chip || chip.classList.contains('used')) return;
      chip.classList.add('used');

      const q = questions[currentIdx];
      const word = q.words[chipId];
      selectedTokens.push({ word, chipId });
      renderSlots();
    };

    window.removeWord = function(index) {
      if (!isChecking) return;
      if (window.duoAudio) duoAudio.playTap();

      const item = selectedTokens[index];
      const chip = document.getElementById('chip-' + item.chipId);
      if (chip) chip.classList.remove('used');

      selectedTokens.splice(index, 1);
      renderSlots();
    };

    function renderSlots() {
      const slotArea = document.getElementById('slotArea');
      if (selectedTokens.length === 0) {
        slotArea.innerHTML = '<span class="duo-slot-hint">Toque nas palavras para montar a frase</span>';
        document.getElementById('btnAction').disabled = true;
      } else {
        slotArea.innerHTML = selectedTokens.map((item, idx) => `
          <button class="duo-word-chip" onclick="removeWord(${idx})">${item.word}</button>
        `).join('');
        document.getElementById('btnAction').disabled = false;
        document.getElementById('footerPlaceholder').style.display = 'none';
      }
    }

    window.handleAction = function() {
      if (isChecking) {
        checkAnswer();
      } else {
        nextQuestion();
      }
    };

    function checkAnswer() {
      const q = questions[currentIdx];
      let isCorrect = false;

      if (q.type === 'choice') {
        isCorrect = (selectedOption === q.correctIndex);
      } else if (q.type === 'word_bank') {
        const assembled = selectedTokens.map(t => t.word).join(' ').trim();
        isCorrect = (assembled === q.correctSentence.trim());
      }

      const footerDrawer = document.getElementById('footerDrawer');
      const feedbackMsg = document.getElementById('feedbackMessage');
      const feedbackIcon = document.getElementById('feedbackIcon');
      const feedbackTitle = document.getElementById('feedbackTitle');
      const feedbackDesc = document.getElementById('feedbackDesc');
      const btnAction = document.getElementById('btnAction');

      feedbackMsg.style.display = 'flex';
      document.getElementById('footerPlaceholder').style.display = 'none';

      if (isCorrect) {
        if (window.duoAudio) duoAudio.playSuccess();
        footerDrawer.className = 'duo-footer-drawer correct';
        feedbackIcon.innerText = '✅';
        feedbackTitle.innerText = 'Incrível!';
        feedbackTitle.style.color = 'var(--duo-green-text)';
        feedbackDesc.innerText = 'Resposta perfeita!';
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-green';
      } else {
        if (window.duoAudio) duoAudio.playError();
        errorsCount++;
        hearts = Math.max(0, hearts - 1);
        document.getElementById('heartsCount').innerText = hearts;

        footerDrawer.className = 'duo-footer-drawer incorrect';
        feedbackIcon.innerText = '❌';
        feedbackTitle.innerText = 'Resposta correta:';
        feedbackTitle.style.color = 'var(--duo-red-text)';
        const correctText = (q.type === 'choice') ? q.options[q.correctIndex] : q.correctSentence;
        feedbackDesc.innerText = correctText;
        btnAction.innerText = 'CONTINUAR';
        btnAction.className = 'btn-duo btn-duo-red';
      }

      isChecking = false;
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        renderQuestion();
      } else {
        finishLesson();
      }
    }

    function finishLesson() {
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('quizArea').style.display = 'none';
      document.getElementById('footerDrawer').style.display = 'none';
      document.getElementById('completionScreen').style.display = 'flex';

      const accuracy = Math.max(0, Math.round(((questions.length - errorsCount) / questions.length) * 100));
      document.getElementById('accuracyVal').innerText = accuracy + '%';
      if (window.duoAudio) duoAudio.playSuccess();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderQuestion();
    });
  </script>
</body>
</html>
