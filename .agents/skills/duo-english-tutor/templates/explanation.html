<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TOPIC_TITLE}} - Explicação | Linguo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../resources/duo-theme.css">
  <script src="../../../resources/duo-sfx.js"></script>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="duo-header">
    <a href="#" class="duo-logo-area">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="15" fill="#58CC02"/>
        <circle cx="11" cy="13" r="5" fill="#ffffff"/>
        <circle cx="21" cy="13" r="5" fill="#ffffff"/>
        <circle cx="11" cy="13" r="2.5" fill="#4B4B4B"/>
        <circle cx="21" cy="13" r="2.5" fill="#4B4B4B"/>
        <polygon points="16,16 13,20 19,20" fill="#FFC800"/>
        <path d="M7 23 C11 26, 21 26, 25 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      linguo
    </a>
    <div class="duo-stats">
      <div class="duo-stat-item duo-stat-fire">
        <span>🔥</span>
        <span>{{STREAK_COUNT}}</span>
      </div>
      <div class="duo-stat-item duo-stat-gem">
        <span>💎</span>
        <span>{{GEMS_COUNT}}</span>
      </div>
      <div class="duo-stat-item duo-stat-heart">
        <span>❤️</span>
        <span>5</span>
      </div>
    </div>
  </header>

  <!-- Progress Bar Header -->
  <div class="duo-progress-container">
    <button class="btn-close" onclick="window.history.back()" title="Voltar">✕</button>
    <div class="duo-progress-track">
      <div class="duo-progress-fill" style="width: 25%;"></div>
    </div>
    <span style="font-weight: 800; font-size: 14px; color: var(--duo-gray-400);">TEORIA</span>
  </div>

  <main class="duo-container">
    <!-- Mascot Dialog Intro -->
    <div class="duo-dialog-box">
      <div class="duo-mascot">
        <svg viewBox="0 0 80 80" width="80" height="80">
          <ellipse cx="40" cy="42" rx="34" ry="32" fill="#58CC02"/>
          <ellipse cx="40" cy="46" rx="22" ry="20" fill="#ffffff" opacity="0.2"/>
          <!-- Big Cute Eyes -->
          <circle cx="28" cy="34" r="12" fill="#ffffff"/>
          <circle cx="52" cy="34" r="12" fill="#ffffff"/>
          <circle cx="30" cy="34" r="6" fill="#131F24"/>
          <circle cx="54" cy="34" r="6" fill="#131F24"/>
          <circle cx="32" cy="32" r="2" fill="#ffffff"/>
          <circle cx="56" cy="32" r="2" fill="#ffffff"/>
          <!-- Orange Beak -->
          <polygon points="40,38 32,46 48,46" fill="#FF9600"/>
          <!-- Feet -->
          <ellipse cx="30" cy="74" rx="8" ry="4" fill="#FF9600"/>
          <ellipse cx="50" cy="74" rx="8" ry="4" fill="#FF9600"/>
        </svg>
      </div>
      <div class="duo-bubble">
        {{MASCOT_MESSAGE}}
      </div>
    </div>

    <h1 class="duo-title">{{TOPIC_TITLE}}</h1>
    <p class="duo-subtitle">{{TOPIC_SUBTITLE}}</p>

    <!-- Visual Concept Blocks -->
    {{CONCEPT_CARDS_HTML}}

    <!-- Footer Action Drawer -->
    <div class="duo-footer-drawer">
      <div class="duo-footer-content">
        <div style="font-weight: 700; color: var(--duo-gray-700);">
          <span>Pronto para fixar com exercícios?</span>
        </div>
        <a href="exercise.html" class="btn-duo btn-duo-green" onclick="duoAudio.playTap()">
          COMEÇAR PRÁTICA ➔
        </a>
      </div>
    </div>
  </main>

</body>
</html>
